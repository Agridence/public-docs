site_name: Agridence Documentation
theme:
  name: material
  logo: https://assets.agridence.com/logos/agridence/agridence-logo.svg
  palette:
    primary: white
    accent: indigo
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.path
    - toc.follow
    - navigation.top
copyright: Copyright &copy; 2025 Agridence Pte. Ltd.
extra:
  generator: false
# Report broken internal links and #anchors; `mkdocs build --strict` in
# .github/workflows/check.yaml turns these warnings into a failed build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
